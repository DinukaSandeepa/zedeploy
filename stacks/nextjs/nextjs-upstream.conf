# /etc/nginx/nextjs-upstream.conf
# Initial content. During a rollout /usr/local/sbin/nextjs-drain rewrites this
# file to mark one instance "down" (drain) while it restarts, then restores it.
# Owned by root: Nginx parses it as root, so a deploy-writable copy would let
# the deploy user gain root.

upstream nextjs_app {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
    keepalive 32;
}
