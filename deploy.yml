# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]

# Never run two deploys at once, and never cancel one half way through
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Used by next.config for skew protection (see README)
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          # Add any NEXT_PUBLIC_* vars the build needs, e.g.:
          # NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Assemble standalone package
        run: |
          # standalone output does not include public/ or .next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          tar -czf release.tar.gz -C .next/standalone .

      - name: Deploy over SSH (tarball streamed to the forced command)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" deploy < release.tar.gz

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            "${{ vars.APP_URL }}/api/health"
