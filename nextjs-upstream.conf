# /etc/nginx/nextjs-upstream.conf
# Initial content. deploy.sh rewrites this file during a rollout to mark one
# instance "down" (drain) while it restarts, then restores it.
# Owned by the deploy user so no root is needed to rewrite it.

upstream nextjs_app {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
    keepalive 32;
}
