# /etc/nginx/conf.d/myapp.conf  (conf.d is included in the http context)

include /etc/nginx/nextjs-upstream.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name example.com;
    # Add TLS with certbot: sudo certbot --nginx -d example.com

    # Hashed static assets are served by Nginx from a shared directory that keeps
    # assets from ALL recent releases. A browser holding HTML from the old build
    # can still fetch old chunks, and vice versa, so no 404s during a rollout.
    location /_next/static/ {
        alias /var/www/myapp/shared/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Fail over to the other instance if one is restarting.
        # Non-idempotent requests (POST etc.) are NOT retried once sent: this is
        # deliberate, do not add "non_idempotent".
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
